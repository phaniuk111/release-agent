name: poc-gke-deploy

# Build BOTH PoC images on GitHub-hosted runners and deploy them to the
# Autopilot demo cluster. This is the CI lane for docs/POC_GKE_DEMO.md:
# scripts/gke-demo-up.sh owns the CLUSTER (infrastructure), this workflow owns
# the IMAGES and the RELEASES (application).
#
# Why the runner and not a laptop: the runner is linux/amd64, matching the
# Autopilot nodes — a dev Mac is arm64 and produces an image the cluster cannot
# execute. Auth is keyless (GitHub OIDC -> Workload Identity Federation), so no
# service-account JSON is ever stored as a repo secret.
#
# One-time bootstrap of the WIF provider + CI service account this needs:
#   scripts/gke-poc-ci-setup.sh
#
# Manual trigger ONLY, on purpose. The demo cluster is created and destroyed per
# session (scripts/gke-demo-up.sh / gke-demo-down.sh), so for most of its life
# there is no cluster to deploy to — a push trigger would fail this workflow on
# every commit to the branch and train everyone to ignore a red X.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the cluster after building"
        type: boolean
        default: true

# Third-party actions are pinned to COMMIT SHAs, not tags. This repo is public
# and this workflow can mint a real Google credential, so a retagged upstream
# action would be a direct path to exfiltrating it. Comments record the tag each
# SHA corresponded to; re-resolve them when you deliberately upgrade.
permissions:
  contents: read
  id-token: write # required to mint the OIDC token WIF exchanges

env:
  PROJECT_ID: flash-keel-412418
  PROJECT_NUMBER: "1065061624068"
  REGION: us-central1
  CLUSTER: release-copilot-demo
  NAMESPACE: release-copilot
  REGISTRY: us-central1-docker.pkg.dev/flash-keel-412418/poc
  WIF_PROVIDER: projects/1065061624068/locations/global/workloadIdentityPools/github-actions-pool/providers/poc-provider
  CI_SA: release-copilot-poc-ci@flash-keel-412418.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            context: .
            dockerfile: Dockerfile.agent
            image: release-copilot
          - name: portal
            context: backstage
            dockerfile: backstage/Dockerfile
            image: backstage-release-copilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Authorise docker against Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:poc
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Namespace
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # The agent's GitHub PAT reaches other repos (BUILD_REPO / DEPLOY_REPO), so
      # the workflow's own GITHUB_TOKEN cannot stand in for it. Set the optional
      # repo secret to have CI manage it; otherwise the Secret that
      # gke-demo-up.sh created in the cluster is left exactly as it is.
      - name: GitHub token secret (only when the repo secret is set)
        env:
          TOKEN: ${{ secrets.RELEASE_COPILOT_GH_TOKEN }}
        if: env.TOKEN != ''
        run: |
          kubectl -n "$NAMESPACE" create secret generic release-copilot-secrets \
            --from-literal=gh-token="$TOKEN" --dry-run=client -o yaml | kubectl apply -f -

      - name: Fail early if the agent has no token to use
        run: |
          kubectl -n "$NAMESPACE" get secret release-copilot-secrets >/dev/null 2>&1 || {
            echo "::error::Secret release-copilot-secrets is missing. Run scripts/gke-demo-up.sh once, or set the RELEASE_COPILOT_GH_TOKEN repo secret."
            exit 1
          }

      # Spot pods on both services. virtualService stays off: the PoC is reached
      # by port-forward, and the chart's default VirtualService references an
      # asm-ingressgateway Gateway a fresh cluster does not have.
      # A run that is cancelled or times out mid-`helm upgrade` leaves the
      # release in pending-install/pending-upgrade, and every later run then
      # dies with "another operation (install/upgrade/rollback) is in progress"
      # until a human intervenes. Recover deterministically instead: roll back
      # if there is a completed revision to return to, otherwise drop the
      # never-completed install so the next step can install cleanly.
      - name: Clear any stuck helm release
        run: |
          for rel in release-copilot backstage; do
            status=$(helm status "$rel" -n "$NAMESPACE" -o json 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["status"])' 2>/dev/null || echo absent)
            case "$status" in
              pending-*)
                echo "::warning::$rel is stuck in $status — recovering"
                if helm rollback "$rel" -n "$NAMESPACE" 2>/dev/null; then
                  echo "  rolled back $rel"
                else
                  helm uninstall "$rel" -n "$NAMESPACE" || true
                  echo "  uninstalled $rel (no completed revision to roll back to)"
                fi
                ;;
              *) echo "$rel: $status" ;;
            esac
          done

      # Spot pods + PoC sizing. Two things worth knowing before changing these:
      #
      # 1. Autopilot bills and schedules on LIMITS, not requests — it raises
      #    requests to match. The charts' defaults (1 vCPU, 1-2GiB) are sized
      #    for a real deployment and are ~4x what a demo needs.
      # 2. This project's SSD_TOTAL_GB quota is 250GB and every Autopilot node
      #    takes a 100GB balanced boot disk, so the cluster is hard-capped at
      #    TWO nodes. Everything has to pack onto them; a third node is refused
      #    with "GCE quota exceeded" and pods sit Pending forever.
      - name: PoC values (spot + right-sized to the node cap)
        run: |
          cat > /tmp/spot.yaml <<'YAML'
          nodeSelector:
            cloud.google.com/gke-spot: "true"
          # Managed CSM injects istio-proxy with a 500m CPU request by default —
          # as much as the app — so every meshed pod costs double. Two pods at
          # 500m+500m plus ~660m of system daemons exceeds the 1930m node and
          # nothing schedules. 100m is ample for a demo's traffic.
          podAnnotations:
            sidecar.istio.io/proxyCPU: "100m"
            sidecar.istio.io/proxyMemory: "128Mi"
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "300m"
              memory: "1Gi"
          YAML
          # Backstage is a Node backend and OOMs under 1Gi; give it headroom.
          sed 's/memory: "1Gi"/memory: "1536Mi"/' /tmp/spot.yaml > /tmp/spot-portal.yaml

      - name: helm upgrade release-copilot (agent)
        run: |
          helm upgrade --install release-copilot ./helm/release-copilot \
            --namespace "$NAMESPACE" \
            --set image.repository="$REGISTRY/release-copilot" \
            --set image.tag="${{ github.sha }}" \
            --set virtualService.enabled=false \
            --set githubToken.existingSecret=release-copilot-secrets \
            --set githubToken.existingSecretKey=gh-token \
            --set config.GOOGLE_CLOUD_PROJECT="$PROJECT_ID" \
            --set config.BUILD_REPO=phaniuk111/devops \
            --set config.DEPLOY_REPO=phaniuk111/deployment-repo \
            --set updateStrategy.rollingUpdate.maxSurge=0 \
            --set updateStrategy.rollingUpdate.maxUnavailable=1 \
            -f /tmp/spot.yaml \
            --wait --timeout 10m

      - name: helm upgrade backstage (portal)
        run: |
          helm upgrade --install backstage ./helm/backstage-portal \
            --namespace "$NAMESPACE" \
            --set image.repository="$REGISTRY/backstage-release-copilot" \
            --set image.tag="${{ github.sha }}" \
            --set releaseCopilot.url="http://release-copilot.$NAMESPACE.svc.cluster.local:8000" \
            --set persistence.enabled=true \
            --set config.app.baseUrl="http://localhost:7007" \
            --set config.backend.baseUrl="http://localhost:7007" \
            -f /tmp/spot-portal.yaml \
            --wait --timeout 10m

      - name: Rollout summary
        run: |
          {
            echo "### Deployed to \`$CLUSTER\`"
            echo '```'
            kubectl -n "$NAMESPACE" get pods
            echo '```'
            echo "Reach it with: \`kubectl -n $NAMESPACE port-forward svc/backstage 7007:7007\`"
          } >> "$GITHUB_STEP_SUMMARY"
