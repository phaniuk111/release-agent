[project]
name = "release-copilot"
version = "0.2.0"
description = "ADK + FastAPI release copilot that promotes container images via GitHub Actions (GKE/ASM)"
readme = "README.md"
# ADK Workflow graphs (google.adk.workflow) require Python >= 3.11.
requires-python = ">=3.11"
dependencies = [
    # Core agent framework. 2.9+: failed workflow nodes rerun on resume (apply_deploy
    # is written to be idempotent for it). 2.14: a confirmed tool runs once per
    # approval, compaction keeps open confirmations, faster long sessions/workflows.
    "google-adk>=2.14",
    # Vertex AI Gemini
    "google-genai>=1.0",
    # Web server (production UI)
    "fastapi>=0.165.0",      # security floor: the image scan flagged 0.138.1
    "uvicorn[standard]>=0.30",
    # GitHub, config, utils
    "PyGithub>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pyyaml>=6.0",
    # Release intake queue (append-only event table; serverless, no Cloud SQL)
    "google-cloud-bigquery>=3.25",
    # The deployment repo's release updater script (run via sys.executable in
    # prepare_release_fileset) round-trips workflow YAML with ruamel.
    "ruamel.yaml>=0.18",
    # VertexAiSessionService (ADK_SESSION_BACKEND=vertex; ADK 2.12+ prefers
    # google-cloud-agentplatform and falls back to this package's client), so
    # chat history can outlive a pod. Kept a hard dependency rather than an extra:
    # the alternative is an image that boots and only fails once someone turns
    # the backend on.
    "google-cloud-aiplatform>=1.71",
    "dulwich>=1.2.22",       # security floor: 1.2.15 has a high advisory
    "pyjwt[crypto]>=2.15.1",   # security floor: 2.13.0 has critical/high advisories (fixed in 2.14.0, 2.15.0)
    # Agent observability (adk_release_agent/telemetry.py): OTLP export of ADK's
    # own spans — to Langfuse — plus the OpenInference instrumentors Langfuse
    # documents for ADK and google-genai. Off unless LANGFUSE_HOST is set.
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "openinference-instrumentation-google-adk>=1.1.2",
    "openinference-instrumentation-google-genai>=1.4.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]  # reserved for future shared ADK session storage
tracing = ["langsmith>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# This is a deployable application, not a library — install dependencies only,
# don't try to build/install the `release_agent` package itself. The app is run
# with `uvicorn ... --app-dir src`.
package = false
# Security floors for transitive dependencies the image scan flagged: a lock
# can never resolve below these, on any Python the image may use (3.11-3.13).
# urllib3 via requests/PyGithub/Dulwich; Authlib and joserfc via google-adk;
# pyasn1 via google-auth; certifi via requests/httpx; AnyIO via
# FastAPI/Starlette/httpx; OpenTelemetry via google-adk and the OTLP exporter.
constraint-dependencies = [
    "urllib3>=2.8.0",
    "authlib>=1.9.10",           # 1.8.0: critical advisories
    "joserfc>=1.7.6",            # 1.7.2: high advisories (fixed 1.7.5 / 1.7.6)
    "pyasn1>=0.6.5",             # 0.6.4: four high advisories
    "certifi>=2026.10.18",       # 2026.6.17: critical advisory
    "anyio>=4.16.0",             # 4.14.2 flagged; uv kept it for Python < 3.13 without this
    "starlette>=1.10.0",
    "opentelemetry-api>=1.45.2", # 1.42.1: two advisories
    "opentelemetry-sdk>=1.45.2",
]

[tool.ruff]
line-length = 100
