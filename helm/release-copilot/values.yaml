# Default values for release-copilot.
# Deploys the FastAPI production UI (port 8000) to GKE behind Anthos Service Mesh.

replicaCount: 1   # In-memory ADK session/artifact services are per-pod; keep 1
                  # unless you add shared ADK storage.

# --- Restart behaviour -------------------------------------------------------
# What makes a restart cheap at ONE replica: the new pod must be ready before
# the old one is killed, so `helm upgrade` is a handover, not a gap.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Long enough for an in-flight SSE turn (a promote can stream for a minute) to
# finish after the pod stops taking new traffic.
terminationGracePeriodSeconds: 60

# A PodDisruptionBudget guards VOLUNTARY disruption only — node drains and
# cluster upgrades. It does nothing for crashes or for `helm upgrade`.
#
# Leave this DISABLED while replicaCount is 1: with a single pod, minAvailable:1
# means the pod can never be evicted, so a node drain blocks indefinitely and
# cluster maintenance wedges on this app. The template refuses that combination
# rather than letting you find out during a node upgrade.
podDisruptionBudget:
  enabled: false
  minAvailable: 1        # used when set; otherwise maxUnavailable applies
  maxUnavailable: ""
  force: false           # bypass the replicaCount>1 guard (you asked for it)

image:
  repository: ghcr.io/phaniuk111/release-copilot
  tag: ""                # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The container runs the image's own CMD (uvicorn on :8000) — no override needed.
containerPort: 8000

# --- Corporate egress proxy (GKE deployments that reach GitHub via a proxy) ---
# All GitHub traffic (PyGithub uses requests, which honors these standard vars)
# and the gh CLI go through httpsProxy when set. NO_PROXY defaults keep the GKE
# metadata server and googleapis (Vertex AI via Private Google Access) direct —
# override noProxy if your Vertex traffic must also use the proxy.
proxy:
  httpsProxy: ""            # e.g. "http://proxy.corp.internal:3128"
  httpProxy: ""             # usually the same value
  noProxy: ""               # defaults to "localhost,127.0.0.1,metadata.google.internal,.googleapis.com"
  # TLS-INSPECTING proxy? (symptom: "certificate verify failed: self-signed
  # certificate in certificate chain"). Put the corporate root CA in a ConfigMap
  # and reference it here — the chart mounts it and points requests, OpenSSL and
  # git at it. Verify from THIS image, not another pod: corporate base images
  # often already trust the CA and hide the problem.
  #   kubectl -n <ns> create configmap corp-proxy-ca --from-file=ca.crt=/path/to/root-ca.crt
  # caBundle:
  #   existingConfigMap: corp-proxy-ca
  #   key: ca.crt

# --- Non-secret configuration (rendered into a ConfigMap, injected via envFrom) ---
# Legend:  [REQUIRED]  app is broken without it — installer must set it
#          [FEATURE]   required only when that feature is used; empty disables cleanly
#          [OPTIONAL]  safe default — tune to your process
# Keys marked "UI-overridable" are only the DEFAULT the forms pre-fill; a developer
# can supply a different value per operation in the UI/chat.
config:
  # ============================ [REQUIRED] ==================================
  # Build repo: image catalog + build runs + controls. UI-overridable per lookup.
  BUILD_REPO: ""
  # GitOps deploy repo (SIT/UAT/PRD/PRL1 branches). UI-overridable per deploy/release.
  DEPLOY_REPO: ""
  # The project hosting VERTEX AI (and BQ unless BQ_PROJECT is set). NOT the GKE
  # cluster's own project — the app never needs the cluster project.
  GOOGLE_CLOUD_PROJECT: ""
  GOOGLE_CLOUD_LOCATION: "us-central1"
  GEMINI_MODEL: "gemini-2.5-flash"
  # Route google-genai to Vertex (Workload Identity / ADC). Keep "true".
  GOOGLE_GENAI_USE_VERTEXAI: "true"

  # ==================== [FEATURE] set only if you use it ====================
  # Dataflow: DF images build in their own repo (empty = BUILD_REPO fallback);
  # a DF deploy is a workflow_dispatch in the DF deploy repo. DF_DEPLOY_REPO is
  # UI-overridable via the DF form's Advanced field.
  DF_BUILD_REPO: ""
  # GitOps repo a DATAFLOW RELEASE is raised in — separate from the CARE release
  # repo (DEPLOY_REPO) so the two releases have independent branch chains and
  # independent in-flight guards. Empty = one repo for both.
  DF_RELEASE_REPO: ""
  DF_DEPLOY_REPO: ""
  # Composer DAGs repo. A DF deploy builds a flex template under a VERSION path
  # in a bucket; the DAGs that launch it carry that version as the fallback of
  #   {{dag_run.conf['version'] | default('0.0.494')}}
  # so the deploy is only half-done until they are bumped. The developer names
  # the DAG files on the deploy form; a PR is raised against COMPOSER_BRANCH and
  # is never auto-merged — the flex-template build takes minutes and can fail.
  # Empty COMPOSER_REPO = the DAG bump is not offered.
  COMPOSER_REPO: ""
  COMPOSER_BRANCH: "main"
  COMPOSER_DAG_DIR_PATTERN: "{env}"   # uat -> uat/<dag>.py
  # Exact file name under .github/workflows/ (case- and suffix-sensitive).
  DF_DEPLOY_WORKFLOW: "df-deploy.yml"
  # Branch to dispatch on. GitHub only accepts a dispatch for a ref that ALREADY
  # holds the workflow file, so set this when the DF repo keeps its deploy
  # workflow on main but its default branch is something else. Empty = default branch.
  DF_DEPLOY_REF: ""
  # Names of the workflow_dispatch inputs to send. GitHub REJECTS the dispatch
  # (HTTP 422 "Unexpected inputs provided") if the payload carries an input the
  # workflow does not declare, so this must match the target workflow's `inputs:`
  # block. {image}, {tag} and {environment} are substituted; omit a key to not
  # send it. For a workflow declaring module + binary_version:
  #   DF_DISPATCH_INPUTS: '{"module": "{image}", "binary_version": "{tag}"}'
  DF_DISPATCH_INPUTS: '{"image": "{image}", "tag": "{tag}", "environment": "{environment}"}'
  # JIRA (read-only). Empty base URL = no lookup; the ticket is stored as typed.
  # The token itself is NOT here — it comes from jiraToken.existingSecret below.
  JIRA_BASE_URL: ""           # e.g. https://your-org.atlassian.net
  JIRA_USER_EMAIL: ""         # technical account the token belongs to
  # Release intake queue + analytics (BigQuery). Table provisioned SEPARATELY
  # (terraform in bigquery/); SA needs dataEditor on the dataset + jobUser.
  # EMPTY BQ_DATASET DISABLES the whole feature cleanly.
  BQ_DATASET: "release_agent"
  BQ_TABLE: "release_intents"
  BQ_LOCATION: "US"
  BQ_AUTO_CREATE: "false"   # keep false in cluster; true only for local dev
  # CARE/DF release forms: lets devs type bare name:version (they can always
  # paste full URLs instead — UI-overridable per artifact line).
  ARTIFACTORY_BASE_URL: ""
  # GitHub Enterprise Server API root. Empty = public github.com (api.github.com).
  GITHUB_BASE_URL: ""
  # Console links: the strip above the chat, where a human goes to LOOK at what a
  # release produced. JSON, environment -> ordered list of links; key order is the
  # tab order and the UI shows one environment at a time. Read-only deep links —
  # the portal never calls them. Each url must be http(s); anything else (and any
  # entry left empty) renders as a disabled chip naming this variable, so the row
  # doubles as a to-do list. Empty = placeholder tabs for UAT/PRL1/PRD.
  #   CONSOLE_LINKS: |
  #     {"UAT": [{"label": "GKE", "url": "https://console.cloud.google.com/kubernetes/workload?project=uat"},
  #              {"label": "Latency", "url": "https://grafana.example.com/d/abc/uat-latency"}],
  #      "PRL1": [{"label": "GKE", "url": "..."}],
  #      "PRD": [{"label": "GKE", "url": "..."}, {"label": "Errors", "url": "..."}]}
  # Optional per-entry "kind": "cluster" or "dashboard" picks the icon; without it
  # the label decides (anything naming GKE/cluster/k8s gets the cluster icon).
  CONSOLE_LINKS: ""

  # ================== [OPTIONAL] safe defaults — tune to process =============
  # Promotion branches in DEPLOY_REPO; prl1_only charts stop at UAT/PRL1.
  SIT_BRANCH: "SIT"
  UAT_BRANCH: "UAT"
  PRD_BRANCH: "PRD"
  PRL1_BRANCH: "PRL1"
  # One release at a time: adds are blocked while an OPEN PR targets one of
  # these. Empty = just PRD_BRANCH. Recommended: "SIT,UAT,PRD,PRL1".
  RELEASE_GUARD_BRANCHES: ""
  # Control step/JOB name prefixes (case-insensitive). RCTLD is the live gate —
  # it covers the RCTLDEF0001691-style SDLC controls; RLFT/RFTL are demo names.
  # A prefix here can REFUSE a queue request, so only add a name the release
  # sign-off actually depends on (e.g. a scanner gate) — not every check that
  # happens to run in the pipeline.
  CONTROL_PREFIXES: "RCTLD,RLFT,RFTL"
  # Fail-closed: block a PRD release when any build control failed.
  PRD_REQUIRE_CONTROLS: "true"
  # Release window policy.
  PRD_CUTOFF_HOUR_UTC: "16"
  PRD_LEAD_TIME_DAYS: "1"
  # Path (inside DEPLOY_REPO) of the team's release file-set generator.
  RELEASE_UPDATER_SCRIPT: "scripts/release/update_release_files.py"
  # Dispatched in DEPLOY_REPO by chat "re-run the deploy for PR #N" to regenerate
  # a deployment PR's control comments. Matched EXACTLY (case + .yml/.yaml). Set
  # it only if that workflow exists; nothing else depends on it.
  ON_MERGE_WORKFLOW: "on-merge-deploy.yml"
  # ADK runtime (leave true).
  ADK_CONTEXT_CACHE: "true"
  ADK_EVENT_COMPACTION: "true"
  ADK_MEMORY_ENABLED: "true"    # in-memory / per-pod — keep replicaCount: 1
  ADK_CONFIRM_PROD_OPS: "true"
  # Where chat sessions live. "memory" = per-pod (a restart loses the
  # conversation). "vertex" stores them in a Vertex AI Agent Engine so they
  # survive restarts — VERTEX_AGENT_ENGINE_ID is then REQUIRED and the pod
  # fails fast without it. See "Persistent chat sessions" in the README.
  # This covers CONVERSATION HISTORY ONLY: pending CONFIRM tokens and connected
  # PATs remain per-pod, so it is not on its own a licence to raise replicaCount.
  ADK_SESSION_BACKEND: "memory"
  # With backend "vertex" the engine is found by DISPLAY NAME in
  # GOOGLE_CLOUD_LOCATION and CREATED if it does not exist — so the same values
  # file works in every project and nobody pastes a numeric id. The pod's SA
  # needs roles/aiplatform.user. Pin VERTEX_AGENT_ENGINE_ID instead to use one
  # exact engine and never create anything.
  VERTEX_AGENT_ENGINE_NAME: "release-copilot-sessions"
  VERTEX_AGENT_ENGINE_ID: ""
  # Deploy-target specifics (code defaults are generic; set your real values):
  # UAT_NAMESPACE: "default"
  # PRD_NAMESPACE: "default"
  # HELM_CHART_DIR: "charts"

  # ================== [ADVANCED] rarely changed (commented) =================
  # Any pydantic setting in src/release_agent/config.py can go here — the
  # ConfigMap passes every key under config: through as env verbatim.
  # BQ_PROJECT: ""                     # BQ in a different project than Vertex
  # ADK_CONTEXT_CACHE_MIN_TOKENS: "1024"   # Gemini 2.5 Flash minimum; below this nothing caches
  # ADK_CONTEXT_CACHE_TTL_SECONDS: "1800"
  # ADK_COMPACTION_INTERVAL: "20"
  # ADK_COMPACTION_OVERLAP: "3"
  # REACT_MAX_TOOL_TURNS: "8"
  # PRD_ONCE_PER_DAY: "true"
  # CHANGE_REQUEST_PATH: "change-request.json"
  # DEPLOYMENT_PATH_PATTERN: "{env}/deployment.json"
  # HELM_VALUES_PATTERN: "{env}/values_{env}.yaml"
  # ENV_CONFIG_PATH: "configs/images.json"
  # MANIFEST_PATH: "release-manifest.json"
  # CONFIG_PATH: "image-workflows.json"

# Extra raw env entries appended to the container (list of {name,value|valueFrom}).
extraEnv: []

# --- GitHub token (required; the in-cluster image has no `gh` login fallback) ---
githubToken:
  # Recommended: reference a Secret you manage (kubectl/external-secrets/sealed-secrets).
  existingSecret: ""          # e.g. "release-copilot-secrets"
  existingSecretKey: "gh-token"
  # Dev convenience only: have the chart create the Secret from this value.
  # Prefer existingSecret in production. Set via --set-string or a private values file.
  value: ""

# --- JIRA technical account (optional; read-only ticket lookup at queue time) ---
# Leave existingSecret empty to disable the lookup — the ticket is then stored as
# typed, unverified. Set config.JIRA_BASE_URL and config.JIRA_USER_EMAIL too.
jiraToken:
  existingSecret: ""          # e.g. "release-copilot-jira" (external-secrets etc.)
  existingSecretKey: "jira-api-token"

serviceAccount:
  create: true
  name: ""
  # GKE Workload Identity: bind this KSA to a GCP SA that has Vertex AI access.
  annotations: {}
    # iam.gke.io/gcp-service-account: release-copilot@<PROJECT_ID>.iam.gserviceaccount.com

# --- ASM / Istio sidecar injection ---
# Sidecar injection comes from the NAMESPACE label (nothing pod-level needed):
#   kubectl label namespace <ns> istio.io/rev=asm-managed --overwrite
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# Probes hit the FastAPI /health endpoint.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3

service:
  type: ClusterIP
  port: 80
  portName: http   # Istio requires a named port; an 'http' prefix sets the protocol.

# --- Istio VirtualService ---
virtualService:
  enabled: true
  hosts:
    - release-copilot.example.com
  # Path prefix for a SHARED domain hosting multiple apps, e.g. "/release-copilot".
  # When set, the app is served at https://<host><pathPrefix>/ and the prefix is
  # stripped before reaching the pod (the UI is prefix-relative, so it just works).
  # Leave "" to serve at the host root "/".
  pathPrefix: ""
  # Gateways the VS attaches to. Ignored when gateway.enabled=true (the chart's
  # own Gateway is used instead). Point this at your ASM ingress gateway, e.g.
  # "istio-ingress/asm-ingressgateway" or "istio-system/asm-ingressgateway".
  gateways:
    - istio-ingress/asm-ingressgateway
  # Long timeout: a promote streams over SSE and polls for the created PR (~40s),
  # well past Envoy's 15s route default. Use "0s" to disable entirely for SSE.
  timeout: "120s"
  retries: {}
    # attempts: 2
    # perTryTimeout: 60s

# --- Optional Istio Gateway (enable only if you don't share a cluster gateway) ---
gateway:
  enabled: false
  selector:
    istio: ingressgateway   # ASM ingress gateway selector
  port:
    number: 80
    name: http
    protocol: HTTP
  tls: {}
    # mode: SIMPLE
    # credentialName: release-copilot-tls

nodeSelector: {}
tolerations: []
affinity: {}
