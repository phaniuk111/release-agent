apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-copilot.fullname" . }}
  labels:
    {{- include "release-copilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "release-copilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "release-copilot.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "release-copilot.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "release-copilot.fullname" . }}-env
          {{- $hasToken := or .Values.githubToken.existingSecret .Values.githubToken.value }}
          {{- $prx := .Values.proxy | default dict }}
          {{- if or $hasToken .Values.extraEnv $prx.httpsProxy $prx.httpProxy $prx.caBundle }}
          env:
            {{- if $hasToken }}
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "release-copilot.secretName" . }}
                  key: {{ .Values.githubToken.existingSecretKey }}
            {{- end }}
            {{- if $prx.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ $prx.httpsProxy | quote }}
            {{- end }}
            {{- if $prx.httpProxy }}
            - name: HTTP_PROXY
              value: {{ $prx.httpProxy | quote }}
            {{- end }}
            {{- if or $prx.httpsProxy $prx.httpProxy }}
            - name: NO_PROXY
              value: {{ $prx.noProxy | default "localhost,127.0.0.1,metadata.google.internal,.googleapis.com" | quote }}
            {{- end }}
            {{- if $prx.caBundle }}
            - name: REQUESTS_CA_BUNDLE
              value: /etc/proxy-ca/{{ $prx.caBundle.key | default "ca.crt" }}
            - name: SSL_CERT_FILE
              value: /etc/proxy-ca/{{ $prx.caBundle.key | default "ca.crt" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $prx.caBundle }}
          volumeMounts:
            - name: proxy-ca
              mountPath: /etc/proxy-ca
              readOnly: true
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- $prx := .Values.proxy | default dict }}
      {{- if $prx.caBundle }}
      volumes:
        - name: proxy-ca
          configMap:
            name: {{ $prx.caBundle.existingConfigMap }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
