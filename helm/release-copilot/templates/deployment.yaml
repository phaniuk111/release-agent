apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-copilot.fullname" . }}
  labels:
    {{- include "release-copilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # maxUnavailable: 0 is what actually makes a restart cheap at replicaCount 1:
  # the replacement pod must pass its readiness probe BEFORE the old one is
  # killed, so `helm upgrade` costs a handover rather than a gap. maxSurge: 1
  # is what allows the extra pod to exist while that happens.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.updateStrategy.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "release-copilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "release-copilot.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # In-flight SSE turns (a promote can stream for a minute) get this long to
      # finish before SIGKILL; the pod stops receiving new traffic immediately.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "release-copilot.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "release-copilot.fullname" . }}-env
          {{- $hasToken := or .Values.githubToken.existingSecret .Values.githubToken.value }}
          {{- $jira := .Values.jiraToken | default dict }}
          {{- $prx := .Values.proxy | default dict }}
          {{- if or $hasToken $jira.existingSecret .Values.extraEnv $prx.httpsProxy $prx.httpProxy $prx.caBundle }}
          env:
            {{- if $hasToken }}
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "release-copilot.secretName" . }}
                  key: {{ .Values.githubToken.existingSecretKey }}
            {{- end }}
            {{- if $jira.existingSecret }}
            # Read-only technical account. Referenced, never templated into the
            # chart — the Secret is managed outside it (external-secrets etc.).
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jira.existingSecret }}
                  key: {{ $jira.existingSecretKey | default "jira-api-token" }}
            {{- end }}
            {{- if $prx.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ $prx.httpsProxy | quote }}
            {{- end }}
            {{- if $prx.httpProxy }}
            - name: HTTP_PROXY
              value: {{ $prx.httpProxy | quote }}
            {{- end }}
            {{- if or $prx.httpsProxy $prx.httpProxy }}
            - name: NO_PROXY
              value: {{ $prx.noProxy | default "localhost,127.0.0.1,metadata.google.internal,.googleapis.com" | quote }}
            {{- end }}
            {{- if $prx.caBundle }}
            {{- $ca := printf "/etc/proxy-ca/%s" (default "ca.crt" $prx.caBundle.key) }}
            # A TLS-INSPECTING proxy re-signs certs with the corporate CA, which
            # the slim base image does not trust. Three vars because the stack
            # has three TLS clients: requests/PyGithub, OpenSSL (httpx, google
            # clients) and git — GIT_SSL_CAINFO is the one that lets the release
            # flow clone the deploy repo.
            - name: REQUESTS_CA_BUNDLE
              value: {{ $ca | quote }}
            - name: SSL_CERT_FILE
              value: {{ $ca | quote }}
            - name: GIT_SSL_CAINFO
              value: {{ $ca | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $prx.caBundle }}
          volumeMounts:
            - name: proxy-ca
              mountPath: /etc/proxy-ca
              readOnly: true
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- $prx := .Values.proxy | default dict }}
      {{- if $prx.caBundle }}
      volumes:
        - name: proxy-ca
          configMap:
            name: {{ $prx.caBundle.existingConfigMap }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
