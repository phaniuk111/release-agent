# Backstage portal chart values.
# Defaults: single-replica PoC, in-cluster sqlite, guest auth,
# proxying to the release-copilot service in the same namespace.

replicaCount: 1

image:
  # Built from backstage/Dockerfile in this repo (backstage_poc branch)
  repository: backstage-release-copilot
  tag: poc
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: ""
  host: backstage.example.internal
  tls: false

# Istio/Gateway-API exposure on a SHARED hostname (GKE + ASM/Istio).
# Backstage is path-prefixed: e.g. https://common-host/idp serves the portal.
# The VS redirects "/idp" -> "/idp/" and strips the prefix before forwarding
# to the pod; the app itself is TOLD the prefix via config.app.baseUrl /
# config.backend.baseUrl (the frontend uses its pathname as router base path).
virtualService:
  enabled: false
  # The common hostname shared by services in the namespace, e.g.:
  # hosts: ["shared.internal.company.com"]
  hosts: []
  # Existing Gateway(s) in the cluster/namespace that terminate the common
  # host, e.g. gateways: ["istio-system/shared-gateway"].
  # If gateway.enabled=true, this chart creates its own gateway instead.
  gateways: []
  pathPrefix: "/idp"
  # timeout: "30s"
  # retries: { attempts: 2, perTryTimeout: "10s" }

gateway:
  enabled: false
  selector:
    istio: ingressgateway
  port:
    number: 80
    name: http
    protocol: HTTP
  # tls:
  #   mode: SIMPLE
  #   credentialName: backstage-tls

# Where the backend proxy forwards /api/proxy/release-copilot/*.
# Points at the release-copilot Helm release's Service (helm/release-copilot).
releaseCopilot:
  # The agent SERVICE listens on 80 and forwards to the container's 8000 — so
  # this is :80, not :8000. Pointing at 8000 hits nothing and every proxied call
  # dies as a 504 after the timeout, which reads like the agent being down.
  # e.g. http://release-copilot.release-copilot.svc.cluster.local:80
  url: "http://release-copilot:80"

# SQLite persistence. PoC default keeps data only for the pod's lifetime
# (emptyDir). Enable persistence to survive pod restarts/reschedules.
#
# NOTE: single-replica only — a PVC with ReadWriteOnce cannot be shared.
# For multi-replica, switch backend.database to Postgres (see config below).
persistence:
  enabled: false
  size: 1Gi
  # storageClassName: ""   # leave empty to use the cluster default
  mountPath: /app/backstage-data

# Backstage app-config overrides merged over the baked-in app-config.yaml.
# Rendered into a ConfigMap mounted as app-config.kubernetes.yaml.
# Paths in catalog.locations are relative to the backend process working
# dir inside the container (/app).
config:
  app:
    baseUrl: http://localhost:7007
  backend:
    baseUrl: http://localhost:7007
    listen: ":7007"
    # Behind the Istio gateway (and any external-auth layer) the pod sees
    # forwarded headers (X-Forwarded-Proto/For) instead of the real scheme —
    # trust them so redirects/OAuth callbacks keep the external https URL.
    trustProxy: true
    # SQLite path is injected by the chart (see persistence.*) — do not set
    # a hardcoded path here unless you override the mount too.
    # For anything real, switch to postgres instead:
    # database:
    #   client: pg
    #   connection: { host: .., port: 5432, user: .., password: .. } (from a Secret)
    database:
      client: better-sqlite3
  auth:
    providers:
      # The built image runs NODE_ENV=production, where Backstage disables the
      # guest provider unless this flag is set — sign-in fails with "you must
      # either enable the legacy guest token or configure the auth backend to
      # support guest sign in". It is named "dangerously" for good reason:
      # everyone who can reach the portal is signed in. Acceptable here only
      # because the PoC is reached by port-forward and has no ingress. Replace
      # with a real provider before exposing this to a network.
      guest:
        dangerouslyAllowOutsideDevelopment: true
  catalog:
    rules:
      - allow: [Component, System, API, Resource, Location]
    locations:
      - type: file
        target: ./examples/entities.yaml
      - type: file
        target: ./examples/release-entities.yaml
      - type: file
        target: ./examples/springboot-service.yaml
        rules:
          - allow: [Component, System, API, Resource, Group]
      - type: file
        target: ./examples/template/template.yaml
        rules:
          - allow: [Template]
      - type: file
        target: ./examples/org.yaml
        rules:
          - allow: [User, Group]

# Health probes. Paths are Backstage's own endpoints (backend-defaults'
# health router), NOT "/" — "/" returns 500 until initialisation finishes.
# startupProbe gives startup up to 5 minutes (30 x 10s) before liveness is
# allowed to act; a cold Backstage with a fresh sqlite DB can take a minute or
# two, and killing it mid-init produces a crash loop that never converges.
startupProbe:
  httpGet:
    path: /.backstage/health/v1/readiness
    port: http
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /.backstage/health/v1/readiness
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
livenessProbe:
  httpGet:
    path: /.backstage/health/v1/liveness
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
# pinning: cloud.google.com/gke-spot: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Extra pod annotations. Managed Cloud Service Mesh reads sidecar sizing from
# here, e.g. sidecar.istio.io/proxyCPU: "100m".
podAnnotations: {}

serviceAccount:
  create: true
  name: ""
