# Backstage portal chart values.
# Defaults: single-replica PoC, in-cluster sqlite, guest auth,
# proxying to the release-copilot service in the same namespace.

replicaCount: 1

image:
  # Built from backstage/Dockerfile in this repo (backstage_poc branch)
  repository: backstage-release-copilot
  tag: poc
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: ""
  host: backstage.example.internal
  tls: false

# Istio/Gateway-API exposure on a SHARED hostname (GKE + ASM/Istio).
# Backstage is path-prefixed: e.g. https://common-host/idp serves the portal.
# The VS redirects "/idp" -> "/idp/" and strips the prefix before forwarding
# to the pod; the app itself is TOLD the prefix via config.app.baseUrl /
# config.backend.baseUrl (the frontend uses its pathname as router base path).
virtualService:
  enabled: false
  # The common hostname shared by services in the namespace, e.g.:
  # hosts: ["shared.internal.company.com"]
  hosts: []
  # Existing Gateway(s) in the cluster/namespace that terminate the common
  # host, e.g. gateways: ["istio-system/shared-gateway"].
  # If gateway.enabled=true, this chart creates its own gateway instead.
  gateways: []
  pathPrefix: "/idp"
  # timeout: "30s"
  # retries: { attempts: 2, perTryTimeout: "10s" }

gateway:
  enabled: false
  selector:
    istio: ingressgateway
  port:
    number: 80
    name: http
    protocol: HTTP
  # tls:
  #   mode: SIMPLE
  #   credentialName: backstage-tls

# Where the backend proxy forwards /api/proxy/release-copilot/*.
# Points at the release-copilot Helm release's Service (helm/release-copilot).
releaseCopilot:
  # The agent SERVICE listens on 80 and forwards to the container's 8000 — so
  # this is :80, not :8000. Pointing at 8000 hits nothing and every proxied call
  # dies as a 504 after the timeout, which reads like the agent being down.
  # e.g. http://release-copilot.release-copilot.svc.cluster.local:80
  url: "http://release-copilot:80"

# SQLite persistence. PoC default keeps data only for the pod's lifetime
# (emptyDir). Enable persistence to survive pod restarts/reschedules.
#
# NOTE: single-replica only — a PVC with ReadWriteOnce cannot be shared.
# For multi-replica, use database.type: postgres (below) and leave this off.
persistence:
  enabled: false
  size: 1Gi
  # storageClassName: ""   # leave empty to use the cluster default
  mountPath: /app/backstage-data

# Extra environment for the Backstage container, as Kubernetes env entries —
# the way a secret reaches the config without sitting in the ConfigMap, e.g. the
# support watcher's notifications token (config: ${SUPPORT_NOTIFY_TOKEN}):
#   - name: SUPPORT_NOTIFY_TOKEN
#     valueFrom: { secretKeyRef: { name: support-notify, key: token } }
extraEnv: []

# Backstage's OWN database (catalog, sign-in signing keys, search, scaffolder
# history). Release Copilot keeps nothing here — its state is BigQuery, GitHub
# and the agent. Steps: helm/backstage-portal/POSTGRES.md.
#   sqlite    PoC: one replica, data lives as long as the pod (or the PVC above)
#   postgres  production, and REQUIRED for replicaCount > 1: replicas must share
#             the signing keys, or a sign-in on one pod is refused by the next
database:
  type: sqlite
  postgres:
    # Password sign-in (any Postgres): a Secret with POSTGRES_HOST,
    # POSTGRES_PORT, POSTGRES_USER and POSTGRES_PASSWORD, created outside the
    # chart — External Secrets / Vault / kubectl. Not used with cloudSql below.
    existingSecret: ""
    # The one database every plugin's schema goes in (created by the DBA).
    database: backstage
    # schema: ONE database, a schema per plugin — no CREATE DATABASE right
    # needed. "database" (Backstage's default) creates a database per plugin.
    pluginDivisionMode: schema
    # Password sign-in to a managed service: most require TLS, e.g.
    #   ssl: { require: true, rejectUnauthorized: true, ca: { $file: /path/ca.crt } }
    # (cloudSql below does its own TLS — leave this false there.)
    ssl: false
    # Per plugin, per replica: ~12 plugins x replicas x max must stay under the
    # server's max_connections (small Cloud SQL tiers allow only ~25-100).
    pool:
      min: 0
      max: 5
    # Google Cloud SQL with Cloud IAM — Backstage's own connector
    # (connection.type: cloudsql): no password, no Secret, no proxy sidecar.
    # The pod signs in as its Workload Identity service account.
    cloudSql:
      enabled: false
      # project:region:instance
      instance: ""
      # PRIVATE for a VPC-native cluster (Backstage defaults to PUBLIC), or PSC.
      ipAddressType: PRIVATE
      # The IAM database user: the service account's email WITHOUT the
      # ".gserviceaccount.com" suffix, e.g. backstage@my-project.iam
      user: ""

# Backstage app-config overrides merged over the baked-in app-config.yaml.
# Rendered into a ConfigMap mounted as app-config.kubernetes.yaml.
# Paths in catalog.locations are relative to the backend process working
# dir inside the container (/app).
config:
  app:
    baseUrl: http://localhost:7007
  backend:
    baseUrl: http://localhost:7007
    listen: ":7007"
    # Behind the Istio gateway (and any external-auth layer) the pod sees
    # forwarded headers (X-Forwarded-Proto/For) instead of the real scheme —
    # trust them so redirects/OAuth callbacks keep the external https URL.
    trustProxy: true
    # backend.database is written by the chart from `database:` above — set
    # it there, not here.
  auth:
    providers:
      # The built image runs NODE_ENV=production, where Backstage disables the
      # guest provider unless this flag is set — sign-in fails with "you must
      # either enable the legacy guest token or configure the auth backend to
      # support guest sign in". It is named "dangerously" for good reason:
      # everyone who can reach the portal is signed in. Acceptable here only
      # because the PoC is reached by port-forward and has no ingress. Replace
      # with a real provider before exposing this to a network.
      guest:
        dangerouslyAllowOutsideDevelopment: true
      # Sign-in from the service mesh (Anthos Service Mesh user auth): the
      # person logs in with the company's IdP at the mesh, which puts a signed
      # RCToken on every request; the `rctoken` provider VERIFIES it (JWKS,
      # issuer, audience, expiry) — the same token and checks as the agent's
      # IDENTITY_* settings. Turn it on with app.meshSignIn: true, and point
      # both at the same header (also the proxy's allowedHeaders in
      # app-config.yaml) so the agent sees the same person.
      # rctoken:
      #   header: x-rctoken
      #   jwksUrl: http://authservice.asm-user-auth.svc.cluster.local:10004/_gcp_user_auth/jwks
      #   issuer: authservice.asm-user-auth.svc.cluster.local
      #   audience: <the UserAuthConfig audience>
      #   emailClaim: attributes.email,email
      #   signIn:
      #     resolvers:
      #       - resolver: emailLocalPartMatchingUserEntityName
      #         dangerouslyAllowSignInWithoutUserInCatalog: true
  # app:
  #   meshSignIn: true
  catalog:
    rules:
      - allow: [Component, System, API, Resource, Location]
    locations:
      - type: file
        target: ./examples/entities.yaml
      - type: file
        target: ./examples/release-entities.yaml
      - type: file
        target: ./examples/springboot-service.yaml
        rules:
          - allow: [Component, System, API, Resource, Group]
      - type: file
        target: ./examples/template/template.yaml
        rules:
          - allow: [Template]
      - type: file
        target: ./examples/org.yaml
        rules:
          - allow: [User, Group]

# Health probes. Paths are Backstage's own endpoints (backend-defaults'
# health router), NOT "/" — "/" returns 500 until initialisation finishes.
# startupProbe gives startup up to 5 minutes (30 x 10s) before liveness is
# allowed to act; a cold Backstage with a fresh sqlite DB can take a minute or
# two, and killing it mid-init produces a crash loop that never converges.
startupProbe:
  httpGet:
    path: /.backstage/health/v1/readiness
    port: http
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /.backstage/health/v1/readiness
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
livenessProbe:
  httpGet:
    path: /.backstage/health/v1/liveness
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
# pinning: cloud.google.com/gke-spot: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Extra pod annotations. Managed Cloud Service Mesh reads sidecar sizing from
# here, e.g. sidecar.istio.io/proxyCPU: "100m".
podAnnotations: {}

serviceAccount:
  create: true
  name: ""
