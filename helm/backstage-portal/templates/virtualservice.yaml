{{- if .Values.virtualService.enabled -}}
{{- $prefix := .Values.virtualService.pathPrefix | trimSuffix "/" -}}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "backstage-portal.fullname" . }}
  labels:
    {{- include "backstage-portal.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.virtualService.hosts | nindent 4 }}
  gateways:
    {{- if .Values.gateway.enabled }}
    - {{ include "backstage-portal.fullname" . }}
    {{- else }}
    {{- toYaml .Values.virtualService.gateways | nindent 4 }}
    {{- end }}
  http:
    {{- if $prefix }}
    # 1) bare "/idp" -> redirect to "/idp/" so relative URLs resolve correctly
    - match:
        - uri:
            exact: {{ $prefix | quote }}
      redirect:
        uri: {{ printf "%s/" $prefix | quote }}
    # 2) "/idp/..." -> strip the prefix before forwarding to the pod.
    #    The app still KNOWS the prefix via config.app.baseUrl (the frontend
    #    uses its pathname as the client-side router base path), so generated
    #    links / asset URLs keep the /idp prefix in the browser.
    - match:
        - uri:
            prefix: {{ printf "%s/" $prefix | quote }}
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "backstage-portal.serviceHost" . }}
            port:
              number: {{ .Values.service.port }}
      {{- with .Values.virtualService.timeout }}
      timeout: {{ . | quote }}
      {{- end }}
      {{- with .Values.virtualService.retries }}
      retries:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    - route:
        - destination:
            host: {{ include "backstage-portal.serviceHost" . }}
            port:
              number: {{ .Values.service.port }}
      {{- with .Values.virtualService.timeout }}
      timeout: {{ . | quote }}
      {{- end }}
      {{- with .Values.virtualService.retries }}
      retries:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
