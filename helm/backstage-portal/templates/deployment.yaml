apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backstage-portal.fullname" . }}
  labels:
    {{- include "backstage-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # SQLite lives on one ReadWriteOnce PVC — a surge pod on another node
  # cannot attach it. Recreate swaps pods instead of overlapping them.
  # (Multi-replica: switch database to Postgres and turn persistence off.)
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "backstage-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backstage-portal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "backstage-portal.serviceAccountName" . }}
      securityContext:
        {{- .Values.podSecurityContext | toYaml | nindent 8 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- .Values.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: backstage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's CMD names only app-config.yaml + app-config.docker.yaml,
          # so the ConfigMap mounted below is inert unless it is passed as a
          # third --config here. Order matters: last file wins on conflicts.
          command: ["node"]
          args:
            - "packages/backend"
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "app-config.docker.yaml"
            - "--config"
            - "app-config.kubernetes.yaml"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # Backend proxy forwards /api/proxy/release-copilot/* here.
            - name: RELEASE_COPILOT_URL
              value: {{ .Values.releaseCopilot.url | quote }}
          resources:
            {{- .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - name: app-config
              mountPath: /app/app-config.kubernetes.yaml
              subPath: app-config.kubernetes.yaml
            - name: backstage-data
              mountPath: {{ .Values.persistence.mountPath }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          # app-config.kubernetes.yaml is merged LAST, after the image's baked-in
          # app-config.yaml / app-config.docker.yaml.
          command:
            - node
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.kubernetes.yaml
      volumes:
        - name: app-config
          configMap:
            name: {{ include "backstage-portal.fullname" . }}-config
        - name: backstage-data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "backstage-portal.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
