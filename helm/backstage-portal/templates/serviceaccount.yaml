{{/*
Without this, serviceAccount.create=true (the default) names a ServiceAccount in
the Deployment that nothing ever creates, and the ReplicaSet cannot make a pod:
  Error creating: pods "backstage-..." is forbidden: error looking up service
  account <ns>/backstage: serviceaccount "backstage" not found
The Deployment reports FailedCreate rather than a failing pod, so there is no pod
to describe and the cause is only visible on the ReplicaSet.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backstage-portal.serviceAccountName" . }}
  labels:
    {{- include "backstage-portal.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
